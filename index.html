<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Merging</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <div id="game-stage">
        <div class="header-bar">
            <div class="score-box">점수: <span id="score-value">0</span></div>
            <button id="reset-btn">초기화</button>
        </div>

        <!-- 6x8 머지 판 -->
        <div id="merge-board"></div>

        <!-- 하단 생성기 버튼 영역 -->
        <div class="spawner-buttons">
            <button class="btn-spawn flower" onclick="spawnItem('flower')">🌸 꽃</button>
            <button class="btn-spawn ocean" onclick="spawnItem('ocean')">🌊 바다</button>
            <button class="btn-spawn space" onclick="spawnItem('space')">🚀 우주</button>
            <button class="btn-spawn random" onclick="spawnRandom()">❓??</button>
        </div>

        <!-- 하단 광고 영역 -->
        <div class="ad-banner">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; height:100%;"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" 
                 data-ad-slot="1234567890"               
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
