<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Merging</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-stage" id="game-stage">
        <div class="center-card">
            <!-- 상단 영역 -->
            <div class="top-section">
                <!-- 좌측 사이드바 -->
                <div class="left-sidebar">
                    <div class="score-box">
                        <div class="score-title">SCORE</div>
                        <div class="score-num" id="score-value">0</div>
                    </div>
                    <button class="reset-btn" id="reset-btn">🔄</button>
                </div>
                <!-- 머지판 -->
                <div class="merge-board" id="merge-board"></div>
            </div>

            <!-- 하단 생성기 퀵바 -->
            <div class="quickbar">
                <div class="generator-slot" onclick="spawnItem('flower')">
                    <img src="images/flower_1.png" alt="꽃">
                </div>
                <div class="generator-slot" onclick="spawnItem('ocean')">
                    <img src="images/ocean_1.png" alt="바다">
                </div>
                <div class="generator-slot" onclick="spawnItem('space')">
                    <img src="images/space_1.png" alt="우주">
                </div>
                <div class="generator-slot" onclick="spawnRandom()">
                    <span style="font-size: 1.2rem; font-weight: bold; color: #444;">??</span>
                </div>
                <div class="generator-slot empty"></div>
                <div class="generator-slot empty"></div>
            </div>

            <!-- 하단 광고 영역 -->
            <div class="ad-banner">
                <ins class="adsbygoogle"
                     style="display:block; width:100%; height:100%;"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" 
                     data-ad-slot="1234567890"               
                     data-ad-format="horizontal"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
